---
# Кастомная роль для разработчиков в namespace default
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: namespace-dev
rules:
- apiGroups: ["", "apps", "networking.k8s.io"] # "" - core API group
  resources: ["pods", "deployments", "services", "ingresses", "configmaps"]
  verbs: ["get", "list", "create", "update", "delete", "watch"]
---
# Привязываем роль namespace-dev ко всем пользователям в группе dev-group
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: dev-group-binding
subjects:
# Привязываемся к группе, а не к конкретному пользователю
- kind: Group
  name: dev-group
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: namespace-dev
  apiGroup: rbac.authorization.k8s.io
---
# Кастомная роль для чтения секретов в namespace default
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
# Привязываем роль secret-reader ко всем пользователям в группе secret-auditors
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: secret-auditors-binding
subjects:
- kind: Group
  name: secret-auditors
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
# Привязываем встроенную роль view ко всем пользователям в группе view-group
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: default
  name: view-group-binding
subjects:
- kind: Group
  name: view-group
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole # Обратите внимание: ClusterRole!
  name: view
  apiGroup: rbac.authorization.k8s.io